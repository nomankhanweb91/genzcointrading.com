<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="taxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="14" fill="url(#taxGrad)"/>
  <rect x="40" y="30" width="640" height="340" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <rect x="40" y="30" width="640" height="40" rx="12" fill="#334155"/>
  <text x="60" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">CAPITAL GAINS &amp; TAXABLE DISPOSITION PRINCIPLES</text>
  <!-- 3 Blocks: Acquisition Basis, Disposal Value, Realized Gain -->
  <g transform="translate(60, 100)">
    <rect width="180" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">COST BASIS</text>
    <text x="16" y="56" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="800">$10,000</text>
    <text x="16" y="80" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Purchase Price + Fees</text>
    <text x="16" y="100" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Documented acquisition date</text>
    <text x="16" y="120" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">FIFO / LIFO / Spec ID</text>

    <!-- Plus/Minus symbol -->
    <text x="195" y="85" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">→</text>

    <g transform="translate(210, 0)">
      <rect width="180" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PROCEEDS (DISPOSAL)</text>
      <text x="16" y="56" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="20" font-weight="800">$18,500</text>
      <text x="16" y="80" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Selling price minus sell fee</text>
      <text x="16" y="100" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Crypto-to-fiat disposal</text>
      <text x="16" y="120" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Crypto-to-crypto trade</text>
    </g>

    <text x="405" y="85" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">=</text>

    <g transform="translate(420, 0)">
      <rect width="180" height="150" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="16" y="26" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">CAPITAL GAIN</text>
      <text x="16" y="56" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="800">+$8,500</text>
      <text x="16" y="80" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">Net Taxable Gain</text>
      <text x="16" y="100" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="10">Short-Term vs Long-Term</text>
      <text x="16" y="120" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="10">Tax rate determined locally</text>
    </g>
  </g>
  <!-- Disclaimer footer -->
  <g transform="translate(60, 275)">
    <rect width="600" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">EDUCATIONAL NOTICE ONLY — NOT FORMAL TAX ADVICE</text>
    <text x="16" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Tax liability rules, reporting guidelines, and holding requirements differ substantially by domestic tax authority.</text>
  </g>
</svg>
