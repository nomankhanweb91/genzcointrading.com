<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.4">
    <line x1="50" y1="50" x2="750" y2="50" />
    <line x1="50" y1="120" x2="750" y2="120" />
    <line x1="50" y1="190" x2="750" y2="190" />
    <line x1="50" y1="260" x2="750" y2="260" />
    <line x1="50" y1="330" x2="750" y2="330" />
    <line x1="50" y1="400" x2="750" y2="400" />
    <line x1="120" y1="30" x2="120" y2="420" />
    <line x1="260" y1="30" x2="260" y2="420" />
    <line x1="400" y1="30" x2="400" y2="420" />
    <line x1="540" y1="30" x2="540" y2="420" />
    <line x1="680" y1="30" x2="680" y2="420" />
  </g>
  <!-- Main Display Card -->
  <rect x="70" y="50" width="420" height="270" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
  <rect x="70" y="50" width="420" height="32" rx="12" fill="#1e293b" />
  <circle cx="92" cy="66" r="4" fill="#ef4444" />
  <circle cx="106" cy="66" r="4" fill="#f59e0b" />
  <circle cx="120" cy="66" r="4" fill="#10b981" />
  <text x="140" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">ANALYTICS WORKBENCH — MATHEMATICAL SIMULATION</text>
  <!-- Candlesticks on Display -->
  <!-- Green Candle 1 -->
  <line x1="130" y1="220" x2="130" y2="160" stroke="#10b981" stroke-width="1.5" />
  <rect x="124" y="175" width="12" height="30" rx="2" fill="#10b981" />
  <!-- Red Candle 2 -->
  <line x1="170" y1="210" x2="170" y2="150" stroke="#ef4444" stroke-width="1.5" />
  <rect x="164" y="165" width="12" height="25" rx="2" fill="#ef4444" />
  <!-- Green Candle 3 -->
  <line x1="210" y1="240" x2="210" y2="140" stroke="#10b981" stroke-width="1.5" />
  <rect x="204" y="150" width="12" height="55" rx="2" fill="#10b981" />
  <!-- Green Candle 4 -->
  <line x1="250" y1="180" x2="250" y2="110" stroke="#10b981" stroke-width="1.5" />
  <rect x="244" y="125" width="12" height="40" rx="2" fill="#10b981" />
  <!-- Red Candle 5 -->
  <line x1="290" y1="160" x2="290" y2="90" stroke="#ef4444" stroke-width="1.5" />
  <rect x="284" y="110" width="12" height="35" rx="2" fill="#ef4444" />
  <!-- Green Candle 6 -->
  <line x1="330" y1="140" x2="330" y2="75" stroke="#10b981" stroke-width="1.5" />
  <rect x="324" y="85" width="12" height="45" rx="2" fill="#10b981" />
  <!-- Moving Average Line -->
  <path d="M 100 230 Q 180 180 250 160 T 360 110 T 450 90" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Trend Indicator Target -->
  <circle cx="360" cy="110" r="4" fill="#38bdf8" />
  <line x1="360" y1="110" x2="460" y2="110" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1.2" />
  <text x="370" y="102" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">TARGET: +24.8%</text>
  <!-- Calculator Floating Card -->
  <g transform="translate(520, 60)">
    <rect width="210" height="320" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="210" height="38" rx="14" fill="url(#blueGrad)" />
    <text x="16" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">CRYPTO CALCULATOR</text>
    <rect x="15" y="52" width="180" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="66" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9">ENTRY PRICE (USD)</text>
    <text x="24" y="82" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">$50,000.00</text>
    <rect x="15" y="98" width="180" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="112" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9">EXIT TARGET (USD)</text>
    <text x="24" y="128" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">$62,500.00</text>
    <rect x="15" y="144" width="180" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="158" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9">POSITION CAPITAL</text>
    <text x="24" y="174" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">$1,000.00</text>
    <!-- Result Highlight Box -->
    <rect x="15" y="192" width="180" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="24" y="210" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">NET ESTIMATED PROFIT</text>
    <text x="24" y="235" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">+$250.00 (+25%)</text>
    <!-- Action Pill Button -->
    <rect x="15" y="264" width="180" height="36" rx="8" fill="url(#greenGrad)" />
    <text x="105" y="287" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">COMPUTE LOCAL RATIOS</text>
  </g>
  <!-- Lower Metric Row -->
  <g transform="translate(70, 336)">
    <rect width="130" height="64" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">RISK / REWARD</text>
    <text x="14" y="48" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="17" font-weight="700">1 : 3.20</text>
    <rect x="145" y="0" width="130" height="64" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="159" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">POSITION RISK</text>
    <text x="159" y="48" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="17" font-weight="700">1.50%</text>
    <rect x="290" y="0" width="200" height="64" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="304" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">EXECUTION ENVIRONMENT</text>
    <text x="304" y="48" fill="#10b981" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">100% Client-Side Engine</text>
  </g>
</svg>
