<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="convGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="14" fill="url(#convGrad)"/>
  <rect x="40" y="30" width="640" height="340" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="40" y="30" width="640" height="40" rx="12" fill="#0369a1"/>
  <text x="60" y="55" fill="#f0f9ff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">CRYPTO CURRENCY &amp; DENOMINATION CONVERTER</text>
  <!-- Converter boxes -->
  <g transform="translate(70, 110)">
    <!-- Box 1 -->
    <rect width="240" height="180" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="20" y="35" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">BITCOIN UNIT (BASE)</text>
    <text x="20" y="75" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">1.00000000</text>
    <text x="20" y="98" fill="#bae6fd" font-family="-apple-system, sans-serif" font-size="12">BTC (Whole Coin)</text>
    <line x1="20" y1="120" x2="220" y2="120" stroke="#0369a1"/>
    <text x="20" y="145" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="11">Subdivision: 100M Satoshis</text>
    <text x="20" y="162" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="11">Precision: 8 Decimals</text>

    <!-- Arrow Exchange -->
    <circle cx="270" cy="90" r="24" fill="#0284c7"/>
    <text x="270" y="96" text-anchor="middle" fill="#ffffff" font-size="18">⇄</text>

    <!-- Box 2 -->
    <g transform="translate(300, 0)">
      <rect width="240" height="180" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="20" y="35" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">SATOSHI DENOMINATION</text>
      <text x="20" y="75" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">100,000,000</text>
      <text x="20" y="98" fill="#bae6fd" font-family="-apple-system, sans-serif" font-size="12">SATS (Atomic Unit)</text>
      <line x1="20" y1="120" x2="220" y2="120" stroke="#0369a1"/>
      <text x="20" y="145" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="11">1 SAT = 0.00000001 BTC</text>
      <text x="20" y="162" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="11">1 mBTC = 100,000 SATS</text>
    </g>
  </g>
  <text x="360" y="335" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">All exchange rates calculated instantaneously via user-entered manual baseline</text>
</svg>
