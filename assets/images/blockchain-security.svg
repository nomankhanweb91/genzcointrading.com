    <text x="30" y="36" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">✓</text>
    <text x="55" y="27" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">24-Word Recovery Mnemonic</text>
    <text x="55" y="45" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="11">Engraved in stainless steel, never stored digitally</text>

    <rect y="74" width="340" height="64" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <circle cx="30" cy="32" r="12" fill="#10b981"/>
    <text x="30" y="36" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">✓</text>
    <text x="55" y="27" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Hardware 2FA (FIDO2 / U2F)</text>
    <text x="55" y="45" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="11">Eliminates SMS-swap vulnerabilities entirely</text>

    <rect y="148" width="340" height="64" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <circle cx="30" cy="32" r="12" fill="#10b981"/>
    <text x="30" y="36" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">✓</text>
    <text x="55" y="27" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Independent Node Verification</text>
    <text x="55" y="45" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="11">Cryptographic proof without third-party RPC trust</text>
