<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="14" fill="url(#secGrad)"/>
  <rect x="40" y="30" width="640" height="340" rx="12" fill="#0f172a" stroke="#312e81" stroke-width="1.2"/>
  <rect x="40" y="30" width="640" height="40" rx="12" fill="#312e81"/>
  <circle cx="65" cy="50" r="5" fill="#a855f7"/>
