<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="14" fill="url(#eduGrad)"/>
  <rect x="40" y="30" width="640" height="340" rx="12" fill="#0f172a" stroke="#4338ca" stroke-width="1.2"/>
  <rect x="40" y="30" width="640" height="40" rx="12" fill="#3730a3"/>
  <text x="60" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">CRYPTOCURRENCY &amp; BLOCKCHAIN CURRICULUM</text>
  <!-- 3 Stages: Fundamentals, Mechanics, Strategic Risk -->
  <g transform="translate(60, 100)">
    <rect width="190" height="220" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <circle cx="95" cy="50" r="26" fill="#312e81"/>
    <text x="95" y="56" text-anchor="middle" fill="#818cf8" font-size="18">01</text>
    <text x="95" y="105" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">FUNDAMENTALS</text>
    <text x="20" y="135" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Distributed Ledger Tech</text>
    <text x="20" y="155" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Proof of Work vs Stake</text>
    <text x="20" y="175" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Bitcoin Halving Cycles</text>
    <text x="20" y="195" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Smart Contracts &amp; EVM</text>

    <g transform="translate(205, 0)">
      <rect width="190" height="220" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
      <circle cx="95" cy="50" r="26" fill="#312e81"/>
      <text x="95" y="56" text-anchor="middle" fill="#818cf8" font-size="18">02</text>
      <text x="95" y="105" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">TRADING MECHANICS</text>
      <text x="20" y="135" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Order Book Dynamics</text>
      <text x="20" y="155" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Liquidity &amp; Slippage</text>
      <text x="20" y="175" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Maker vs Taker Fees</text>
      <text x="20" y="195" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Funding Rates &amp; Basis</text>
    </g>

    <g transform="translate(410, 0)">
      <rect width="190" height="220" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
      <circle cx="95" cy="50" r="26" fill="#312e81"/>
      <text x="95" y="56" text-anchor="middle" fill="#818cf8" font-size="18">03</text>
      <text x="95" y="105" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">RISK &amp; SECURITY</text>
      <text x="20" y="135" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Mathematical Position Sizing</text>
      <text x="20" y="155" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Cold Custody Protocols</text>
      <text x="20" y="175" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Phishing &amp; Scam Defense</text>
      <text x="20" y="195" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11">• Expectancy &amp; Win-Loss</text>
    </g>
