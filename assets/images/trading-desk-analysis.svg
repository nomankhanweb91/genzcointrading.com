<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="14" fill="url(#deskBg)"/>
  <rect x="40" y="30" width="640" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <!-- Top bar of trading terminal -->
  <rect x="40" y="30" width="640" height="40" rx="12" fill="#1e293b"/>
  <text x="60" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">TECHNICAL ANALYSIS WORKSPACE — EDUCATIONAL FRAMEWORK</text>
  <text x="660" y="55" text-anchor="end" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">LOCAL STUDY SIMULATION</text>
  <!-- Chart area -->
  <line x1="80" y1="120" x2="520" y2="120" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="530" y="124" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">RESISTANCE: $68,400</text>
  <line x1="80" y1="280" x2="520" y2="280" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="530" y="284" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">SUPPORT: $56,200</text>
  <!-- Price wave -->
  <path d="M 80 270 Q 150 140 220 220 T 360 130 T 480 180" fill="none" stroke="#10b981" stroke-width="3"/>
  <!-- Breakout arrow -->
  <path d="M 480 180 L 510 110" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 2"/>
  <polygon points="510,105 505,116 516,114" fill="#38bdf8"/>
  <text x="515" y="100" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">BREAKOUT LEVEL</text>
  <!-- Right control panel -->
  <g transform="translate(530, 140)">
    <rect width="130" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">POSITION SIZING</text>
    <text x="12" y="38" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Calculated Units</text>
    <rect y="56" width="130" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="76" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">STOP LOSS RATIO</text>
    <text x="12" y="94" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">-2.0% Risk Limit</text>
    <rect y="112" width="130" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="132" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">TAKE PROFIT</text>
    <text x="12" y="150" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">+6.0% (1:3 R/R)</text>
  </g>
</svg>
