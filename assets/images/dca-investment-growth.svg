<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dcaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="14" fill="url(#dcaGrad)"/>
  <rect x="40" y="30" width="640" height="340" rx="12" fill="#0f172a" stroke="#134e4a" stroke-width="1.2"/>
  <rect x="40" y="30" width="640" height="40" rx="12" fill="#115e59"/>
  <text x="60" y="55" fill="#f0fdfa" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">DOLLAR-COST AVERAGING (DCA) ACCUMULATION MODEL</text>
  <!-- Chart showing Volatile Price vs Smoothed DCA Entry -->
  <g transform="translate(60, 100)">
    <!-- Volatile Price Line (Yellow) -->
    <path d="M 20 160 Q 80 40 140 180 T 260 50 T 380 200 T 480 80" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2"/>
    <!-- Average Cost Line (Teal straight/smooth ascending) -->
    <path d="M 20 150 Q 150 140 280 120 T 480 95" fill="none" stroke="#2dd4bf" stroke-width="3.5"/>
    <!-- Dots for Purchases -->
    <circle cx="80" cy="145" r="5" fill="#2dd4bf"/>
    <circle cx="160" cy="135" r="5" fill="#2dd4bf"/>
    <circle cx="240" cy="125" r="5" fill="#2dd4bf"/>
    <circle cx="320" cy="115" r="5" fill="#2dd4bf"/>
    <circle cx="400" cy="105" r="5" fill="#2dd4bf"/>
    
    <text x="500" y="85" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Spot Volatility</text>
    <text x="500" y="105" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Effective DCA Average</text>
  </g>
  <!-- Metrics below -->
  <g transform="translate(60, 290)">
    <rect width="180" height="60" rx="6" fill="#134e4a"/>
    <text x="14" y="22" fill="#99f6e4" font-family="-apple-system, sans-serif" font-size="10">RECURRING ALLOCATION</text>
    <text x="14" y="44" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">$100 / Weekly</text>

    <rect x="200" width="180" height="60" rx="6" fill="#134e4a"/>
    <text x="214" y="22" fill="#99f6e4" font-family="-apple-system, sans-serif" font-size="10">EMOTIONAL MITIGATION</text>
    <text x="214" y="44" fill="#34d399" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Zero Timing Anxiety</text>

    <rect x="400" width="200" height="60" rx="6" fill="#134e4a"/>
    <text x="414" y="22" fill="#99f6e4" font-family="-apple-system, sans-serif" font-size="10">MATHEMATICAL AVERAGE</text>
    <text x="414" y="44" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Harmonic Cost Basis</text>
  </g>
</svg>
