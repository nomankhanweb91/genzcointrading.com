<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="glosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="14" fill="url(#glosGrad)"/>
  <rect x="40" y="30" width="640" height="340" rx="12" fill="#0f172a" stroke="#047857" stroke-width="1.2"/>
  <rect x="40" y="30" width="640" height="40" rx="12" fill="#065f46"/>
  <text x="60" y="55" fill="#ecfdf5" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">CRYPTOCURRENCY LEXICON &amp; TERMINOLOGY DIRECTORY</text>
  <!-- Vocabulary Cards A-Z Matrix -->
  <g transform="translate(60, 95)">
    <!-- Term 1 -->
    <rect width="180" height="70" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="14" y="24" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">ATH (All-Time High)</text>
    <text x="14" y="44" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">Peak recorded historical valuation of an asset</text>

    <!-- Term 2 -->
    <rect x="200" width="180" height="70" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="214" y="24" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">DCA (Dollar-Cost Avg)</text>
    <text x="214" y="44" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">Systematic periodic investment strategy</text>

    <!-- Term 3 -->
    <rect x="400" width="190" height="70" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="414" y="24" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">LIQUIDATION</text>
    <text x="414" y="44" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">Forced close when position margin is exhausted</text>

    <!-- Term 4 -->
    <rect y="85" width="180" height="70" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="14" y="109" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">HALVING</text>
    <text x="14" y="129" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">Programmed 50% block reward reduction</text>

    <!-- Term 5 -->
    <rect x="200" y="85" width="180" height="70" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="214" y="109" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">SATOSHI</text>
    <text x="214" y="129" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">Smallest Bitcoin subunit (0.00000001 BTC)</text>

    <!-- Term 6 -->
    <rect x="400" y="85" width="190" height="70" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="414" y="109" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">TOKENOMICS</text>
    <text x="414" y="129" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">Economic model and supply emission dynamics</text>

    <!-- Term 7 -->
    <rect y="170" width="180" height="70" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="14" y="194" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">SLIPPAGE</text>
    <text x="14" y="214" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">Delta between expected and executed price</text>

    <!-- Term 8 -->
    <rect x="200" y="170" width="180" height="70" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="214" y="194" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">SEED PHRASE</text>
    <text x="214" y="214" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">BIP39 root mnemonic generating private keys</text>

    <!-- Term 9 -->
    <rect x="400" y="170" width="190" height="70" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="414" y="194" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">RISK / REWARD</text>
    <text x="414" y="214" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">Expected return relative to prospective loss</text>
  </g>
</svg>
