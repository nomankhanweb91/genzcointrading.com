<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="riskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="14" fill="url(#riskGrad)"/>
  <rect x="40" y="30" width="640" height="340" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1.2"/>
  <rect x="40" y="30" width="640" height="40" rx="12" fill="#18181b"/>
  <circle cx="65" cy="50" r="5" fill="#f59e0b"/>
  <text x="85" y="55" fill="#fafafa" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">CAPITAL PRESERVATION &amp; RISK MANAGEMENT FRAMEWORK</text>
  <!-- Shield visual -->
  <g transform="translate(100, 110)">
    <path d="M 80 20 Q 150 10 150 20 L 150 90 Q 150 170 80 200 Q 10 170 10 90 L 10 20 Z" fill="#27272a" stroke="#f59e0b" stroke-width="2"/>
    <text x="80" y="85" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">1%</text>
    <text x="80" y="110" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">RULE</text>
    <text x="80" y="130" text-anchor="middle" fill="#d4d4d8" font-family="-apple-system, sans-serif" font-size="10">Max Risk / Trade</text>
  </g>
  <!-- Formula and cards on the right -->
  <g transform="translate(300, 100)">
    <rect width="340" height="60" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="16" y="24" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">POSITION SIZE EQUATION</text>
    <text x="16" y="46" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Position Size = Account Capital × Risk% ÷ Distance to Stop</text>

    <rect y="72" width="340" height="70" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="16" y="96" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">RISK / REWARD RATIO SCALING</text>
    <text x="16" y="122" fill="#10b981" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">1 : 2.5 Min Threshold (40% Win-Rate Profitability)</text>

    <rect y="154" width="340" height="76" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="16" y="178" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">DRAWDOWN PREVENTION</text>
    <text x="16" y="198" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12">10 consecutive 1% losses = ~9.5% drawdown</text>
    <text x="16" y="216" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12">10 consecutive 10% losses = ~65% severe destruction</text>
  </g>
</svg>
